<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlgoShield · Safety control plane</title>
<style>
body{background:#0c1422;color:#e4ecfa;font:16px system-ui;margin:0;padding:40px;max-width:1200px}h1{font-size:36px;margin-bottom:6px}p{color:#9cacc4}button{background:#1b3656;color:white;border:1px solid #486580;padding:12px 18px;border-radius:7px;cursor:pointer;margin:5px}button.kill{background:#8b2938}section{background:#142035;padding:20px;margin:20px 0;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #2a3b53;padding:10px}pre{overflow:auto;font-size:12px}#error{color:#ffafaf}.badge{color:#74e0c5}
</style>
<h1>AlgoShield</h1><p>Safety control plane · <span id="mode"></span></p>
<button id="demo">Run replay demo</button><button id="reconcile">Reconcile</button><button class="kill" id="kill">Kill all strategies</button>
<p id="error" role="alert"></p><section><strong id="health" class="badge">Loading backend state…</strong><p id="certificate"></p></section>
<section><h2>Subscriptions & virtual ledgers</h2><table><thead><tr><th>Strategy</th><th>State</th><th>Position</th><th>Net P&L</th><th>Charges</th></tr></thead><tbody id="rows"></tbody></table></section>
<section><h2>Execution evidence</h2><p id="counts"></p><pre id="fills"></pre></section>
<section><h2>Safety timeline</h2><pre id="audit"></pre></section>
<script>
const el=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);const s=await r.json();el('mode').textContent=s.mode;el('health').textContent=`${s.health} · Gate ${s.gate}`;el('certificate').textContent=s.kill?`Kill ${s.kill.status} · ${s.kill.elapsed_seconds.toFixed(3)}s · open orders ${s.kill.open_orders} · virtual flat ${s.kill.virtual_positions_flat}`:'No kill certificate issued';el('rows').replaceChildren();for(const sub of s.subscriptions){const positions=s.positions.filter(p=>p.strategy_instance_id===sub.id);const tr=document.createElement('tr');for(const value of [sub.id,sub.running?'RUNNING':'STOPPED',positions.reduce((a,p)=>a+p.net_quantity,0),positions.reduce((a,p)=>a+Number(p.net_pnl),0).toFixed(2),positions.reduce((a,p)=>a+Number(p.charges),0).toFixed(2)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}el('rows').append(tr)}el('counts').textContent=`${s.orders.length} orders · ${s.fills.length} unique fills · ${s.candles.length} recent closed candles`;el('fills').textContent=JSON.stringify(s.fills.slice(-8),null,2);el('audit').textContent=s.audit.map(a=>`${a.sequence} ${a.type} ${a.payload}`).join('\n')}catch(e){el('error').textContent=String(e)}}
for(const action of ['demo','reconcile','kill'])el(action).onclick=async()=>{el(action).disabled=true;try{const r=await fetch('/api/'+action,{method:'POST'});if(!r.ok)throw Error((await r.json()).detail);el('error').textContent='';await refresh()}catch(e){el('error').textContent=String(e)}finally{el(action).disabled=false}};
refresh();setInterval(refresh,2000);
</script></html>
