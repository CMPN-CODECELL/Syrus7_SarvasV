<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AlgoShield Register - Create Strategy Account" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff'/%3E%3Cpath d='M7 20h5v6H7zm7-14h5v20h-5zm7 7h5v13h-5z' fill='%23a57d2d'/%3E%3C/svg%3E"
    />
    <title>AlgoShield · Create Account</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f8f7f4;
        --surface: #ffffff;
        --ink: #181716;
        --muted: #5f5c56;
        --line: #e5e1d8;
        --gold: #a57d2d;
        --gold-dark: #76550f;
        --gold-wash: #f6efdf;
        --danger: #9b2f3f;
        --danger-wash: #fbebed;
        --success: #226c55;
        --r-sm: 0.55rem;
        --r-md: 0.9rem;
        --r-lg: 1.35rem;
        --shadow: 0 18px 55px rgba(60, 47, 20, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 15% 15%,
            rgba(165, 125, 45, 0.1),
            transparent 28rem
          ),
          var(--canvas);
        color: var(--ink);
        font:
          15px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid rgba(229, 225, 216, 0.85);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        padding: 0.85rem 1.5rem;
      }
      .topbar {
        max-width: 1200px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: inherit;
      }
      .brand-mark {
        width: 2rem;
        height: 2rem;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        align-items: end;
        gap: 3px;
        padding: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 0.7rem;
        background: var(--surface);
      }
      .brand-mark i {
        display: block;
        background: var(--gold);
        border-radius: 1px;
      }
      .brand-mark i:nth-child(1) { height: 45%; }
      .brand-mark i:nth-child(2) { height: 90%; }
      .brand-mark i:nth-child(3) { height: 65%; }
      .brand strong {
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }
      .brand span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
      }
      .container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
      }
      .auth-card {
        width: 100%;
        max-width: 460px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow);
        padding: 2.2rem 2rem;
      }
      .auth-card h1 {
        margin: 0 0 0.35rem;
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .auth-card p.subtitle {
        margin: 0 0 1.6rem;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .alert {
        display: none;
        padding: 0.75rem 1rem;
        border-radius: var(--r-sm);
        font-size: 0.85rem;
        margin-bottom: 1.2rem;
        line-height: 1.4;
      }
      .alert.error {
        display: block;
        background: var(--danger-wash);
        color: var(--danger);
        border: 1px solid rgba(155, 47, 63, 0.2);
      }
      .alert.success {
        display: block;
        background: #eef7f2;
        color: var(--success);
        border: 1px solid rgba(34, 108, 85, 0.2);
      }
      .field {
        margin-bottom: 1.1rem;
      }
      .field label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--ink);
      }
      .field .hint {
        font-size: 0.73rem;
        color: var(--muted);
        font-weight: 400;
        margin-left: 0.35rem;
      }
      .field input {
        width: 100%;
        padding: 0.7rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: #fff;
        font-size: 0.92rem;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .field input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(165, 125, 45, 0.15);
      }
      .btn-submit {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--ink);
        color: #fff;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.05s;
        margin-top: 0.5rem;
      }
      .btn-submit:hover {
        background: #2a2826;
      }
      .btn-submit:active {
        transform: scale(0.99);
      }
      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .card-footer {
        margin-top: 1.6rem;
        padding-top: 1.2rem;
        border-top: 1px solid var(--line);
        font-size: 0.84rem;
        color: var(--muted);
        text-align: center;
      }
      .card-footer a {
        color: var(--gold-dark);
        font-weight: 600;
        text-decoration: none;
      }
      .card-footer a:hover {
        text-decoration: underline;
      }
      .back-nav {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.82rem;
      }
      .back-nav a {
        color: var(--muted);
        text-decoration: none;
      }
      .back-nav a:hover {
        color: var(--ink);
      }
      @media (max-width: 480px) {
        .topbar {
          padding: 0.75rem 1rem;
        }
        .container {
          padding: 1.5rem 0.85rem;
        }
        .auth-card {
          padding: 1.6rem 1.25rem;
        }
        .auth-card h1 {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <a href="/" class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <div>
            <strong>AlgoShield</strong>
            <span>Strategy safety control</span>
          </div>
        </a>
      </div>
    </header>

    <main class="container">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Set up platform credentials and trading account</p>

        <div id="alert-box" class="alert" role="alert" aria-live="polite"></div>

        <form id="register-form">
          <div class="field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="e.g. trader_bob"
              required
              autofocus
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="At least 4 characters"
              minlength="6"
              required
            />
          </div>

          <div class="field">
            <label for="confirm_password">Confirm Password</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              autocomplete="new-password"
              placeholder="Re-enter password"
              minlength="6"
              required
            />
          </div>

          <button type="submit" id="submit-btn" class="btn-submit">
            Create Account
          </button>
        </form>

        <div class="card-footer">
          Already have an account?
          <a href="/login">Sign in</a>
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById("register-form");
      const alertBox = document.getElementById("alert-box");
      const submitBtn = document.getElementById("submit-btn");

      function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = "alert " + (isError ? "error" : "success");
      }

      function clearAlert() {
        alertBox.textContent = "";
        alertBox.className = "alert";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const confirm_password = document.getElementById("confirm_password").value;

        if (!username) {
          showAlert("Username is required.");
          return;
        }

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters.");
          return;
        }

        if (password !== confirm_password) {
          showAlert("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";

        try {
          const resp = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await resp.json();

          if (!resp.ok) {
            showAlert(data.detail || "Account creation failed.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            return;
          }

          showAlert("Account created. Opening dashboard…", false);

          setTimeout(() => {
            window.location.href = "/";
          }, 400);
        } catch (err) {
          showAlert("Network error connecting to platform.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account";
        }
      });
    </script>
  </body>
</html>
