[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "algoshield"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.15,<1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the bootstrap baseline stable across Ruff minor releases.
select = ["E4", "E7", "E9", "F"]


[tool.setuptools.package-data]
"backend.shared" = ["migrations/*.sql", "sqlite_migrations/*.sql"]
